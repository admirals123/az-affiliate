<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealHunt — Best Amazon Deals</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a2e; }
    a { color: inherit; text-decoration: none; }

    header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: #ff9900; }
    .header-right { display: flex; gap: 1rem; align-items: center; font-size: 0.85rem; opacity: 0.8; }

    .hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; padding: 3.5rem 2rem; text-align: center; }
    .hero h1 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900; line-height: 1.2; margin-bottom: 1rem; }
    .hero h1 em { font-style: normal; color: #ff9900; }
    .hero p { font-size: 1.1rem; opacity: 0.8; max-width: 560px; margin: 0 auto; }

    .aff-notice { background: #fff8e1; border-bottom: 1px solid #ffe082; padding: 0.5rem 2rem; text-align: center; font-size: 0.78rem; color: #6d4c0f; }

    .controls { display: flex; flex-wrap: wrap; gap: 0.75rem; padding: 1.25rem 2rem; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .controls input[type=search] { flex: 1; min-width: 180px; padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; outline: none; }
    .controls input[type=search]:focus { border-color: #ff9900; }
    .controls select { padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; background: #fff; cursor: pointer; }
    .prime-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; cursor: pointer; user-select: none; }
    .prime-toggle input { accent-color: #0070c0; width: 16px; height: 16px; }

    .cat-row { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.75rem 2rem; background: #fff; border-bottom: 1px solid #e0e0e0; scrollbar-width: none; }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-pill { flex-shrink: 0; padding: 0.35rem 0.9rem; border: 1px solid #ccc; border-radius: 999px; background: #fff; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; }
    .cat-pill:hover { border-color: #ff9900; color: #ff9900; }
    .cat-pill.active { background: #ff9900; border-color: #ff9900; color: #fff; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.07); display: flex; flex-direction: column; transition: transform 0.15s, box-shadow 0.15s; position: relative; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .card-img { width: 100%; height: 180px; object-fit: contain; background: #f9f9f9; padding: 1rem; }
    .card-img-placeholder { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: #f0f0f0; }
    .badge-discount { position: absolute; top: 10px; right: 10px; background: #e53935; color: #fff; font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; }
    .badge-prime { position: absolute; top: 10px; left: 10px; background: #0070c0; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .card-cat { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
    .card-title { font-size: 0.9rem; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-rating { font-size: 0.8rem; color: #ff9900; }
    .card-rating span { color: #555; margin-left: 0.25rem; }
    .card-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem; margin-top: auto; }
    .price-now { font-size: 1.2rem; font-weight: 800; color: #b12704; }
    .price-was { font-size: 0.85rem; color: #999; text-decoration: line-through; }
    .price-save { font-size: 0.8rem; color: #388e3c; font-weight: 600; }
    .cta-btn { display: block; margin-top: 0.75rem; padding: 0.6rem; background: #ff9900; color: #fff; text-align: center; border-radius: 8px; font-weight: 700; font-size: 0.9rem; transition: background 0.15s; }
    .cta-btn:hover { background: #e68a00; }

    .loading, .error, .empty { padding: 4rem 2rem; text-align: center; color: #666; font-size: 1.1rem; }
    .error { color: #c62828; }

    footer { background: #1a1a2e; color: rgba(255,255,255,.5); text-align: center; padding: 2rem; font-size: 0.85rem; margin-top: 2rem; }

    @media (max-width: 600px) {
      .grid { padding: 1rem; }
      .controls, .cat-row { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect, useCallback } = React;
    const API = "";

    const SORT_OPTIONS = [
      { value: "discount",    label: "Biggest Discount" },
      { value: "price-asc",   label: "Price: Low → High" },
      { value: "price-desc",  label: "Price: High → Low" },
      { value: "rating",      label: "Best Rated" },
      { value: "savings",     label: "Most Savings" },
      { value: "newest",      label: "Newest" },
    ];

    function App() {
      const [deals, setDeals]         = useState([]);
      const [cats, setCats]           = useState(["All"]);
      const [activeCat, setActiveCat] = useState("All");
      const [sort, setSort]           = useState("discount");
      const [query, setQuery]         = useState("");
      const [primeOnly, setPrime]     = useState(false);
      const [loading, setLoading]     = useState(true);
      const [updatedAt, setUpdatedAt] = useState(null);
      const [error, setError]         = useState(null);

      useEffect(() => {
        fetch(API + "/api/deals/categories")
          .then(r => r.json())
          .then(d => setCats(d.categories))
          .catch(() => {});
      }, []);

      const loadDeals = useCallback(() => {
        setLoading(true);
        setError(null);
        const params = new URLSearchParams({ sort });
        if (activeCat !== "All") params.set("cat", activeCat);
        if (query.trim())        params.set("q", query.trim());
        if (primeOnly)           params.set("prime", "true");

        fetch(API + "/api/deals?" + params)
          .then(r => r.json())
          .then(d => { setDeals(d.deals); setUpdatedAt(d.updatedAt); })
          .catch(() => setError("Could not load deals. Is the API server running?"))
          .finally(() => setLoading(false));
      }, [activeCat, sort, query, primeOnly]);

      useEffect(() => { loadDeals(); }, [loadDeals]);

      function discount(d) { return Math.round((1 - d.price / d.was) * 100); }
      function stars(n) { return "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n)); }

      return React.createElement("div", { className: "app" },
        React.createElement("header", null,
          React.createElement("div", { className: "logo" }, "Deal", React.createElement("span", null, "Hunt")),
          React.createElement("div", { className: "header-right" },
            React.createElement("span", { className: "deal-count" }, deals.length + " deals"),
            updatedAt && React.createElement("span", { className: "updated" },
              "Updated " + new Date(updatedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
            )
          )
        ),
        React.createElement("section", { className: "hero" },
          React.createElement("h1", null, "Best Amazon Deals, ", React.createElement("em", null, "hunted daily")),
          React.createElement("p", null, "Our bot scans Amazon every 4 hours to find the biggest discounts across all categories.")
        ),
        React.createElement("div", { className: "aff-notice" }, "As an Amazon Associate, we earn from qualifying purchases."),
        React.createElement("div", { className: "controls" },
          React.createElement("input", { type: "search", placeholder: "Search deals…", value: query, onChange: e => setQuery(e.target.value) }),
          React.createElement("select", { value: sort, onChange: e => setSort(e.target.value) },
            SORT_OPTIONS.map(o => React.createElement("option", { key: o.value, value: o.value }, o.label))
          ),
          React.createElement("label", { className: "prime-toggle" },
            React.createElement("input", { type: "checkbox", checked: primeOnly, onChange: e => setPrime(e.target.checked) }),
            "Prime only"
          )
        ),
        React.createElement("div", { className: "cat-row" },
          cats.map(c => React.createElement("button", {
            key: c,
            className: "cat-pill" + (activeCat === c ? " active" : ""),
            onClick: () => setActiveCat(c)
          }, c))
        ),
        loading
          ? React.createElement("div", { className: "loading" }, "Loading deals…")
          : error
            ? React.createElement("div", { className: "error" }, error)
            : deals.length === 0
              ? React.createElement("div", { className: "empty" }, "No deals match your filters.")
              : React.createElement("div", { className: "grid" },
                  deals.map(deal =>
                    React.createElement("div", { key: deal.asin, className: "card" },
                      deal.image
                        ? React.createElement("img", { className: "card-img", src: deal.image, alt: deal.title, loading: "lazy" })
                        : React.createElement("div", { className: "card-img-placeholder" }, "🛍"),
                      deal.prime && React.createElement("span", { className: "badge-prime" }, "prime"),
                      React.createElement("span", { className: "badge-discount" }, "-" + discount(deal) + "%"),
                      React.createElement("div", { className: "card-body" },
                        React.createElement("div", { className: "card-cat" }, deal.cat),
                        React.createElement("div", { className: "card-title" }, deal.title),
                        deal.rating && React.createElement("div", { className: "card-rating" },
                          stars(deal.rating),
                          React.createElement("span", null, deal.rating + (deal.reviews ? " (" + deal.reviews.toLocaleString() + ")" : ""))
                        ),
                        React.createElement("div", { className: "card-price" },
                          React.createElement("span", { className: "price-now" }, "$" + deal.price.toFixed(2)),
                          React.createElement("span", { className: "price-was" }, "$" + deal.was.toFixed(2)),
                          React.createElement("span", { className: "price-save" }, "Save $" + deal.savings.toFixed(2))
                        ),
                        React.createElement("a", {
                          className: "cta-btn",
                          href: deal.url,
                          target: "_blank",
                          rel: "nofollow noopener noreferrer"
                        }, "View on Amazon →")
                      )
                    )
                  )
                ),
        React.createElement("footer", null,
          React.createElement("p", null, "DealHunt · Amazon Associate · Prices subject to change")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
